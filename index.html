<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>勻加速直線運動模擬器</title>
  <meta name="referrer" content="no-referrer" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; font-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <h1>勻加速直線運動模擬器</h1>
        <p>用三條運動方程調校初速、加速度、時間等變數，觀察車子點樣郁。</p>
      </div>
      <span class="badge">HKDSE · 勻加速直線運動</span>
    </header>
    <div class="grid">
      <section class="card">
        <div class="stage">
          <canvas id="world" width="900" height="250"></canvas>
          <div class="hud">
            <div class="chip" id="hudTime">t = 0.00 s</div>
            <div class="chip" id="hudVel">v = 0.00 m/s</div>
            <div class="chip" id="hudDisp">s = 0.00 m</div>
          </div>
        </div>
        <div class="controls">
          <button class="btn btn-play" id="btnPlay">▶ 播放</button>
          <button class="btn btn-stop" id="btnReset">↺ 重設</button>
          <label class="speed">播放速率
            <select id="rate">
              <option value="0.5">0.5×</option>
              <option value="1" selected>1×</option>
              <option value="2">2×</option>
              <option value="4">4×</option>
            </select>
          </label>
        </div>
        <div class="eqs">
          <article class="eq"><h3>公式 1　速度－時間</h3><div class="formula">v = u + at</div><div class="plug" id="plug1"></div></article>
          <article class="eq"><h3>公式 2　位移－時間</h3><div class="formula">s = ut + ½at²</div><div class="plug" id="plug2"></div></article>
          <article class="eq"><h3>公式 3　速度－位移</h3><div class="formula">v² = u² + 2as</div><div class="plug" id="plug3"></div></article>
        </div>
        <div class="graphs">
          <div class="gbox"><h4>v–t 圖（速度對時間）</h4><canvas class="graph" id="vt" width="520" height="140"></canvas></div>
          <div class="gbox"><h4>s–t 圖（位移對時間）</h4><canvas class="graph" id="st" width="520" height="140"></canvas></div>
        </div>
      </section>
      <aside class="card">
        <div class="mode-row" id="modes"></div>
        <div class="vars" id="vars"></div>
        <p class="warn" id="warn"></p>
        <div class="presets">
          <button class="preset" data-p="accel">由靜止加速</button>
          <button class="preset" data-p="cruise">勻速行駛</button>
          <button class="preset" data-p="brake">煞車停下</button>
          <button class="preset" data-p="highway">高速公路加速</button>
          <button class="preset" data-p="reverse">倒後行駛</button>
        </div>
        <div class="legend">
          <span><i class="dot" style="background:var(--u)"></i>u 初速</span>
          <span><i class="dot" style="background:var(--v)"></i>v 末速</span>
          <span><i class="dot" style="background:var(--a)"></i>a 加速度</span>
          <span><i class="dot" style="background:var(--s)"></i>s 位移</span>
          <span><i class="dot" style="background:var(--t)"></i>t 時間</span>
        </div>
        <footer>
          假設物體做<strong>勻加速直線運動</strong>。單位用 SI。<br />
          本頁完全在瀏覽器內運算：無帳戶、無 Cookie、無分析、無對外連線、唔儲存任何學生輸入。
        </footer>
      </aside>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
